# Development environment only. Production deployment is not defined.
# Secrets are passed to each service by name, so no service sees another's credential.
name: aicos-dev

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: aicos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      GOVERNANCE_DB_PASSWORD: ${GOVERNANCE_DB_PASSWORD:?set in .env}
    volumes:
      # PostgreSQL 18 images keep data in a versioned directory below this path.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: during init the temporary server listens only on the socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "aicos"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - backend

  ensure_roles:
    # Runs as the postgres superuser on every compose-up, creating any missing
    # roles before Alembic migrations attempt to GRANT privileges to them.
    # This is the fix for existing volumes that predate a role being added.
    image: postgres:18.6-trixie
    entrypoint: ["/bin/sh", "/scripts/ensure-roles.sh"]
    environment:
      POSTGRES_DB: aicos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      GOVERNANCE_DB_PASSWORD: ${GOVERNANCE_DB_PASSWORD:?set in .env}
    volumes:
      - ./docker/postgres/ensure-roles.sh:/scripts/ensure-roles.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: aicos
      DB_USER: migrator
      DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set in .env}
    depends_on:
      db:
        condition: service_healthy
      ensure_roles:
        condition: service_completed_successfully
    networks:
      - backend

  api:
    build:
      context: .
      target: dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: aicos
      DB_USER: app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      # Exposed for integration tests only. The runtime process uses only DB_PASSWORD above.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      GOVERNANCE_DB_PASSWORD: ${GOVERNANCE_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./apps:/app/apps:ro
      - ./core:/app/core:ro
      - ./tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
